<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TaskFlow - Manage your daily tasks.">
  <title>TaskFlow - Gestion des tâches</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-content">
      <p class="eyebrow">ORGANISEZ VOTRE JOURNÉE</p>
      <h1>TaskFlow</h1>
      <p class="subtitle">Toutes vos tâches, au même endroit.</p>
    </div>
  </header>
 
  <main class="container">
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Ajouter une tâche</h2>
      <form id="taskForm" class="task-form">
        <label class="sr-only" for="taskInput">Nom de la tâche</label>
        <input
          id="taskInput"
          name="task"
          type="text"
          maxlength="120"
          placeholder="Ex. Préparer la présentation GitHub..."
          autocomplete="off"
          required
        >
        <button class="button button-primary" type="submit">Ajouter</button>
      </form>
    </section>
 
    <section class="task-section" aria-labelledby="tasks-title">
      <div class="section-heading">
        <div>
          <h2 id="tasks-title">Mes tâches</h2>
          <p id="taskCount" class="muted">0 tâche</p>
        </div>
        <div class="filters" aria-label="Filtrer les tâches">
          <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">Toutes</button>
          <button class="filter-button" type="button" data-filter="pending" aria-pressed="false">En attente</button>
          <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Terminées</button>
        </div>
      </div>
      <div id="taskList" class="task-list" aria-live="polite"></div>
    </section>
    <p class="storage-note">Vos tâches sont sauvegardées dans ce navigateur.</p>
  </main>
 
  <script type="module" src="./app.js"></script>
</body>
</html>
